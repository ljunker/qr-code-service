<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/style.css" rel="stylesheet" />

    <title>QR Code Generator</title>
</head>

<body>
    <main>
        <h1>QR Generator</h1>

        <p class="subtitle">
            Text eingeben. QR-Code bekommen.
        </p>

        <form id="qr-form" class="input-group">
            <input id="text" type="text" placeholder="https://example.com" autocomplete="off">

            <button type="submit">
                Erzeugen
            </button>
        </form>

        <div id="qr-result" class="qr-result" hidden>
            <img id="qr-code" alt="QR Code">

            <button id="copy-button" class="copy-button" type="button">
                Code kopieren
            </button>
        </div>

        <footer>
            qr.kryptikk.de
        </footer>
    </main>

    <script>
        let currentQrBlob = null;

        async function generateQrCode() {
            document.querySelector("#qr-result").hidden = false;
            const text = document.querySelector("#text").value;

            const response = await fetch("/api/qr", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text
                })
            });

            currentQrBlob = await response.blob();

            const imageUrl = URL.createObjectURL(currentQrBlob);

            const image = document.querySelector("#qr-code");

            image.src = imageUrl;

            const copyButton = document.querySelector("#copy-button");
            copyButton.addEventListener("click", async () => {
                if (!currentQrBlob) {
                    return;
                }

                await navigator.clipboard.write([
                    new ClipboardItem({
                        "image/png": currentQrBlob
                    })
                ]);

                const button = document.querySelector("#copy-button");

                button.textContent = "Kopiert :)";

                setTimeout(() => {
                    button.textContent = "Code kopieren";
                }, 1500);
            });
        }

        const form = document.querySelector("#qr-form");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            await generateQrCode();
        });
    </script>
</body>

</html>
