<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/style.css" rel="stylesheet" />

    <title>QR Code Generator</title>
    <link rel="icon" href="/static/favicon.ico">

    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">

    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">

    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>

<body>
    <main>
        <h1>QR Generator</h1>

        <div id="input-section">
            <form id="qr-form" class="input-group">
                <input id="text" type="text" placeholder="https://example.com" autocomplete="off">

                <button type="submit">
                    QR-Code
                </button>
            </form>

            <div class="separator">
                <span>oder WLAN</span>
            </div>

            <form id="wifi-form" class="wifi-form">
                <input id="wifi-ssid" type="text" placeholder="WLAN-Name (SSID)" autocomplete="off" required>

                <input id="wifi-password" type="password" placeholder="Passwort" autocomplete="off">

                <select id="wifi-security">
                    <option value="WPA">WPA / WPA2 / WPA3</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">Kein Passwort</option>
                </select>
                <button type="submit">
                    WLAN QR-Code
                </button>
            </form>
        </div>

        <div id="qr-result" class="qr-result" hidden>
            <img id="qr-code" alt="QR Code">

            <button id="copy-button" class="copy-button" type="button">
                Code kopieren
            </button>

            <button id="reset-button" class="reset-button" type="button">
                Neuer QR-Code
            </button>
        </div>

        <footer>
            qr.kryptikk.de
        </footer>
    </main>

    <script>
        let currentQrBlob = null;
        let currentQrUrl = null;

        async function generateQrCode(text) {
            const response = await fetch("/api/qr", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text
                })
            });

            if (!response.ok) {
                return;
            }

            currentQrBlob = await response.blob();

            if (currentQrUrl) {
                URL.revokeObjectURL(currentQrUrl);
            }

            currentQrUrl = URL.createObjectURL(currentQrBlob);

            const image = document.querySelector("#qr-code");

            image.src = currentQrUrl;

            document.querySelector("#qr-result").hidden = false;
            document.querySelector("#input-section").hidden = true;

            const copyButton = document.querySelector("#copy-button");
            copyButton.addEventListener("click", async () => {
                if (!currentQrBlob) {
                    return;
                }

                await navigator.clipboard.write([
                    new ClipboardItem({
                        "image/png": currentQrBlob
                    })
                ]);

                const button = document.querySelector("#copy-button");

                button.textContent = "Kopiert :)";

                setTimeout(() => {
                    button.textContent = "Code kopieren";
                }, 1500);
            });
        }

        const form = document.querySelector("#qr-form");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const text = document.querySelector("#text").value;

            await generateQrCode(text);
        });

        function escapeWifi(value) {
            return value
                .replaceAll("\\", "\\\\")
                .replaceAll(";", "\\;")
                .replaceAll(",", "\\,")
                .replaceAll(":", "\\:");
        }

        const wifiForm = document.querySelector("#wifi-form");
        wifiForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const ssid = document.querySelector("#wifi-ssid").value;
            const password = document.querySelector("#wifi-password").value;
            const security = document.querySelector("#wifi-security").value;

            let wifiString;

            if (security === "nopass") {
                wifiString = `WIFI:T:nopass;S:${escapeWifi(ssid)};;`;
            } else {
                wifiString = `WIFI:T:${security};S:${escapeWifi(ssid)};P:${escapeWifi(password)};;`;
            }

            await generateQrCode(wifiString);
        });

        const resetButton = document.querySelector("#reset-button");
        resetButton.addEventListener("click", () => {
            document.querySelector("#qr-result").hidden = true;
            document.querySelector("#input-section").hidden = false;
            document.querySelector("#qr-form").reset();
            document.querySelector("#wifi-form").reset();
            const image = document.querySelector("#qr-code");
            image.removeAttribute("src");

            if (currentQrUrl) {
                URL.revokeObjectURL(currentQrUrl);
                currentQrUrl = null;
            }

            currentQrBlob = null;

            document.querySelector("#copy-button").textContent = "Code kopieren";
            document.querySelector("#text").focus();
        });
    </script>
</body>

</html>
