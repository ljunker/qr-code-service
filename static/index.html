<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/style.css" rel="stylesheet" />

    <title>QR Code Generator</title>
</head>

<body>
    <main>
        <h1>QR Generator</h1>

        <p class="subtitle">
            Text eingeben. QR-Code bekommen.
        </p>

        <form id="qr-form" class="input-group">
            <input id="text" type="text" placeholder="https://example.com" autocomplete="off">

            <button type="submit">
                Erzeugen
            </button>
        </form>

        <div class="qr-container">
            <img id="qr-code" alt="QR Code" style="display: none;">
        </div>

        <footer>
            qr.kryptikk.de
        </footer>
    </main>

    <script>
        async function generateQrCode() {
            const text = document.querySelector("#text").value;

            const response = await fetch("/api/qr", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text
                })
            });

            const blob = await response.blob();

            const imageUrl = URL.createObjectURL(blob);

            const image = document.querySelector("#qr-code");

            image.src = imageUrl;
            image.style.display = "block";
        }

        const form = document.querySelector("#qr-form");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            await generateQrCode();
        });
    </script>
</body>

</html>
